version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.4.6 # cimg browsers images don't ship Chrome/chromedriver
  node: circleci/node@5.0.2 # cimg images can't pin a node version
jobs: # basic units of work in a run
  build: # runs not using Workflows must have a `build` job as entry point
    parallelism: 1 # run only one instance of this job in parallel
    docker: # run the steps with Docker
      - image: cimg/elixir:1.11.4-browsers
        environment: # environment variables for primary container
          MIX_ENV: test
      - image: cimg/postgres:13.6-postgis # database image

    working_directory: ~/app # directory where steps will run

    steps: # commands that comprise the `build` job
      - checkout # check out source code to working directory
      - node/install:
          node-version: "24.21.0" # keep in sync with .tool-versions
      - browser-tools/install-chrome
      - browser-tools/install-chromedriver

      - run: mix local.hex --force # install Hex locally (without prompt)
      - run: mix local.rebar --force # fetch a copy of rebar (without prompt)

      - restore_cache: # restores saved mix cache
          keys: # list of cache keys, in decreasing specificity
            - v4-mix-cache-{{ .Branch }}-{{ checksum "mix.lock" }}
            - v4-mix-cache-{{ .Branch }}
            - v4-mix-cache
      - restore_cache: # restores saved build cache
          keys:
            - v4-build-cache-{{ .Branch }}
            - v4-build-cache
      - run: mix do deps.get, compile # get updated dependencies & compile them
      - restore_cache:
          name: Restore Yarn Package Cache
          keys:
            - v1-yarn-packages-{{ .Branch }}-{{ checksum "yarn.lock" }}
            - v1-yarn-packages-{{ .Branch }}
            - v1-yarn-packages-master
            - v1-yarn-packages-
      - run:
          name: Install Node Dependencies
          command: yarn install
      - save_cache:
          name: Save Yarn Package Cache
          key: v1-yarn-packages-{{ .Branch }}-{{ checksum "yarn.lock" }}
          paths:
            - node_modules/
      - save_cache: # generate and store cache so `restore_cache` works
          key: v4-mix-cache-{{ .Branch }}-{{ checksum "mix.lock" }}
          paths: "deps"
      - save_cache: # make another less specific cache
          key: v4-mix-cache-{{ .Branch }}
          paths: "deps"
      - save_cache: # you should really save one more cache just in case
          key: v4-mix-cache
          paths: "deps"
      - save_cache: # don't forget to save a *build* cache, too
          key: v4-build-cache-{{ .Branch }}
          paths: "_build"
      - save_cache: # and one more build cache for good measure
          key: v4-build-cache
          paths: "_build"

      - run: # special utility that stalls main process until DB is ready
          name: Wait for DB
          command: dockerize -wait tcp://localhost:5432 -timeout 1m

      - run: yarn test # run all js tests in project
      - run: yarn run compile-test
      - run:
          command: |
            if [ "$COVERALLS_REPO_TOKEN" != "" ]; then
              mix coveralls.circle --include feature_test;
            else
              mix test --exclude feature_test;
              mix test --only feature_test;
            fi

      - store_test_results: # upload test results for display in Test Summary
          path: _build/test/junit
      - store_artifacts:
          path: screenshots

  deploy:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/app # directory where steps will run
    steps:
      - checkout
      - run:
          name: Deploy to Gigalixir
          command: |
            git remote add gigalixir https://$GIGALIXIR_EMAIL:$GIGALIXIR_API_KEY@git.gigalixir.com/$GIGALIXIR_APP_NAME.git
            git -c http.extraheader="GIGALIXIR-CLEAN: true" push gigalixir HEAD:refs/heads/master --force

      - run:
          name: Notify HoneyBadger of Deploy
          command: |
            curl --data "deploy[environment]=production&deploy[revision]=$CIRCLE_SHA1&deploy[repository]=https://github.com/stride-nyc/remote_retro&api_key=$HONEYBADGER_API_KEY" "https://api.honeybadger.io/v1/deploys"

  deploy-staging:
    machine:
      image: ubuntu-2204:current
    working_directory: ~/app # directory where steps will run
    steps:
      - checkout
      - run:
          name: Deploy to Gigalixir staging
          command: |
            git remote add gigalixir-staging https://$GIGALIXIR_EMAIL:$GIGALIXIR_API_KEY@git.gigalixir.com/remote-retro-staging.git
            git push gigalixir-staging HEAD:refs/heads/master --force

workflows:
  # every merge to master is tested and deployed to staging
  build-and-deploy-staging:
    jobs:
      - build
      - deploy-staging:
          requires:
            - build
          filters:
            branches:
              only: master

  # production deploys are triggered by pushing a date-based tag (see bin/deploy-production)
  release:
    jobs:
      - deploy:
          filters:
            tags:
              only: /^v[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$/
            branches:
              ignore: /.*/
